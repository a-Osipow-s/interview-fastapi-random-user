[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.2",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "debugpy>=1.8.15",
    "fastapi>=0.115.14",
    "gunicorn>=23.0.0",
    "pydantic-settings>=2.10.1",
    "pydantic[email]>=2.11.7",
    "pyjwt[crypto]>=2.10.1",
    "pytest>=8.4.1",
    "python-multipart>=0.0.20",
    "ruff>=0.12.2",
    "uvicorn>=0.35.0",
]

[tool.ruff]
line-length = 79
indent-width = 4
extend-exclude = ["alembic"]

[tool.ruff.format]
quote-style = "double"
