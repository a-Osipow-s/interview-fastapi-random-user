[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core
    "fastapi==0.117.1",
    "starlette==0.48.0",
    "uvicorn==0.36.0",

    # Database / ODM
    "beanie==2.0.0",
    "motor==3.7.1",
    "pymongo==4.15.1",
    "SQLAlchemy==2.0.43",
    "asyncpg>=0.30.0",        # keep pg support in case
    "alembic>=1.16.2",

    # Validation / Settings
    "pydantic==2.11.9",
    "pydantic[email]==2.11.9",
    "pydantic-settings==2.10.1",
    "pydantic_core==2.33.2",
    "annotated-types==0.7.0",
    "typing-inspection==0.4.1",
    "typing_extensions==4.15.0",
    "lazy-model==0.3.0",

    # Security
    "bcrypt>=4.3.0",
    "pyjwt[crypto]>=2.10.1",

    # Infra
    "redis>=6.2.0",
    "python-multipart>=0.0.20",
    "gunicorn>=23.0.0",

    # Config / Env
    "python-decouple==3.8",
    "python-dotenv==1.1.1",

    # Utils
    "click==8.3.0",
    "colorama==0.4.6",
    "dnspython==2.8.0",
    "anyio==4.11.0",
    "greenlet==3.2.4",
    "h11==0.16.0",
    "idna==3.10",
    "sniffio==1.3.1",

    # Dev / Debug / Test
    "debugpy>=1.8.15",
    "pytest>=8.4.1",
    "ruff>=0.12.2",
]

[tool.ruff]
line-length = 79
indent-width = 4
extend-exclude = ["alembic"]

[tool.ruff.format]
quote-style = "double"
